[project]
name = "multiagent-recsys"
version = "0.1.0"
description = "Multi-Agent Collaborative Personalized Recommendation System with Deep Learning and LLMs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "AgentRec" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
