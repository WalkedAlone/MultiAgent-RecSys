# ---------------------------------------------------------------------------
# Ranking and re-ranking configuration.
# DIN is the default fine-ranking model; DeepFM is the comparison baseline.
# ---------------------------------------------------------------------------
ranking:
  model: din

  din:
    checkpoint_path: checkpoints/din_best.pt
    batch_size: 256
    max_history_length: 50

  deepfm:
    checkpoint_path: checkpoints/deepfm_best.pt
    batch_size: 1024

  rerank:
    enabled: true
    top_k: 10
    enable_mmr: true
    # Diversity default selected on validation. Compared with pure DIN, this
    # trades some top-10 accuracy for more unique categories; set
    # enable_mmr=false to serve/measure the undiversified ranking.
    mmr_lambda: 0.9
    similarity: category
    max_per_category: 5
    max_per_brand: null

  filters:
    exclude_purchased: true
    apply_budget_constraint: true
